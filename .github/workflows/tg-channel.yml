# Бот Telegram-канала: запускается каждый час и публикует то, что пора по расписанию (МСК):
#   ежедневно 09 утро · 11 ставка дня · 12 опрос · 13 новости · 14 верняк · 17 экспресс · 19 прогноз на вечер
#   ср 15 школа ставок · пт 18 матчи выходных · вс 20 ответственная игра
#   1-го числа 10 — итоги месяца и обновление закреплённого поста
#   каждый запуск — ответы «✅ Зашло / ❌ Не зашло» на посты, когда на сайте появился результат
# Нужно: секрет TG_CHANNEL_BOT_TOKEN (или TG_BOT_TOKEN) и бот — администратор канала.
name: Telegram-канал

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Что опубликовать (auto — по расписанию)"
        type: choice
        options: [auto, results, morning, bet, poll, news, lock, express, evening, school, weekend, responsible, monthly, pinned]
        default: auto
      dry_run:
        description: "Только проверка — ничего не публиковать"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tg-channel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Опубликовать в канал
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_BOT_TOKEN: ${{ secrets.TG_CHANNEL_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python scripts/tg_channel_bot.py "${{ inputs.slot || 'auto' }}"

      - name: Запомнить опубликованное
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tg_channel_state.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Канал: опубликованные посты"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
