# Продлевает токены Threads и Instagram (они действуют 60 дней) — 1 и 20 числа, автоматически.
# Нужен секрет GH_PAT: токен GitHub с правом изменять секреты этого репозитория.
# Без GH_PAT сценарий просто напомнит, что токен пора обновить вручную.
name: Продление токенов Threads и Instagram

on:
  schedule:
    - cron: "13 4 1,20 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Продлить токен
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::Нет секрета THREADS_ACCESS_TOKEN"; exit 0; fi
          RESP=$(curl -s "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=$TOKEN")
          NEW=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
          if [ -z "$NEW" ]; then echo "::error::Не удалось продлить токен: $RESP" | sed "s/$TOKEN/***/g"; exit 1; fi
          echo "::add-mask::$NEW"
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Токен продлён, но секрет GH_PAT не задан — новый токен некуда сохранить. Обновите THREADS_ACCESS_TOKEN вручную до истечения 60 дней."
            exit 0
          fi
          gh secret set THREADS_ACCESS_TOKEN --body "$NEW" -R "${{ github.repository }}"
          echo "::notice::Токен Threads продлён ещё на 60 дней"

      - name: Продлить токен Instagram
        if: always()
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::Нет секрета INSTAGRAM_ACCESS_TOKEN"; exit 0; fi
          RESP=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$TOKEN")
          NEW=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
          if [ -z "$NEW" ]; then echo "::error::Не удалось продлить токен Instagram: $RESP" | sed "s/$TOKEN/***/g"; exit 1; fi
          echo "::add-mask::$NEW"
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Токен Instagram продлён, но секрет GH_PAT не задан. Обновите INSTAGRAM_ACCESS_TOKEN вручную до истечения 60 дней."
            exit 0
          fi
          gh secret set INSTAGRAM_ACCESS_TOKEN --body "$NEW" -R "${{ github.repository }}"
          echo "::notice::Токен Instagram продлён ещё на 60 дней"

      - name: Продлить токены рилс-аккаунтов (Альберт, Алекс)
        if: always()
        env:
          IG_ALBERT_TOKEN: ${{ secrets.IG_ALBERT_TOKEN }}
          IG_ALEX_TOKEN: ${{ secrets.IG_ALEX_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for NAME in IG_ALBERT_TOKEN IG_ALEX_TOKEN; do
            TOKEN="${!NAME}"
            [ -z "$TOKEN" ] && { echo "Нет секрета $NAME — пропускаю"; continue; }
            RESP=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$TOKEN")
            NEW=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
            if [ -z "$NEW" ]; then echo "::error::Не удалось продлить $NAME: ${RESP//$TOKEN/***}"; continue; fi
            echo "::add-mask::$NEW"
            if [ -z "$GH_TOKEN" ]; then echo "::warning::$NAME продлён, но нет GH_PAT — обновите секрет вручную до истечения 60 дней."; continue; fi
            gh secret set "$NAME" --body "$NEW" -R "${{ github.repository }}" && echo "::notice::$NAME продлён ещё на 60 дней"
          done
