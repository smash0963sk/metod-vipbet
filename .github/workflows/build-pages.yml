# Собирает страницы матчей, архив и карту сайта после каждого обновления прогнозов
# и сообщает Яндексу (IndexNow) о новых и изменённых страницах.
name: Страницы прогнозов

on:
  push:
    branches: [main]
    paths:
      - data/predictions.json
      - data/logos*.json
      - data/articles.json
      - scripts/build_pages.py
      - scripts/indexnow.py
      - scripts/site_config.json
      - .github/workflows/build-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать страницы
        run: python scripts/build_pages.py

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # страницы, изменённые самим push (если их собрали заранее)
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD -- '*.html' > changed.txt || true
          else
            : > changed.txt
          fi
          git add -A match school archive.html privacy.html bonus.html school.html sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git diff --cached --name-only -- '*.html' >> changed.txt
            git commit -m "Страницы прогнозов и архив"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              sleep 10
            done
            [ "$ok" = 1 ] || exit 1
          else
            echo "Без изменений"
          fi
          echo "index.html" >> changed.txt
          echo "archive.html" >> changed.txt
          sort -u changed.txt -o changed.txt
          cat changed.txt

      # GitHub Pages публикует изменения около минуты — ждём, потом сообщаем Яндексу
      - name: Сообщить Яндексу о новых страницах
        run: |
          sleep 90
          if git log -1 --pretty=%B | grep -q '\[indexnow-all\]'; then
            python scripts/indexnow.py --sitemap || true
          else
            python scripts/indexnow.py $(cat changed.txt) || true
          fi
