# Собирает страницы матчей, архив и карту сайта после каждого обновления прогнозов.
name: Страницы прогнозов

on:
  push:
    branches: [main]
    paths:
      - data/predictions.json
      - data/logos*.json
      - scripts/build_pages.py
      - scripts/site_config.json
      - .github/workflows/build-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать страницы
        run: python scripts/build_pages.py

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A match archive.html privacy.html sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Страницы прогнозов и архив"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
