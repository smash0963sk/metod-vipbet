# Бот Metod VIPBET для Threads: три поста в день из прогнозов сайта.
# Сейчас расписание выключено: аккаунт Threads ведёт бот персонажа (persona.yml, 70% лайфстайл / 30% ставки),
# а этот бот публикует 100% прогнозов. Запуск — только вручную.
#   09:40 МСК — итоги вчерашнего дня и «Ставка дня»
#   13:40 МСК — «Верняк дня»
#   17:40 МСК — «Экспресс дня»
# Ручной запуск: вкладка Actions → «Threads» → Run workflow (можно выбрать слот и режим проверки).
name: Threads

on:
  # schedule:
  #   - cron: "40 6 * * *"    # 09:40 МСК
  #   - cron: "40 10 * * *"   # 13:40 МСК
  #   - cron: "40 14 * * *"   # 17:40 МСК
  workflow_dispatch:
    inputs:
      slot:
        description: "Какой пост опубликовать"
        type: choice
        options: [morning, midday, evening]
        default: morning
      dry_run:
        description: "Только проверка — ничего не публиковать"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Выбрать слот
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "40 6 * * *")  echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            "40 10 * * *") echo "slot=midday"  >> "$GITHUB_OUTPUT" ;;
            "40 14 * * *") echo "slot=evening" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Опубликовать в Threads
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python scripts/threads_bot.py "${{ steps.slot.outputs.slot }}"

      - name: Запомнить опубликованное
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threads_state.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Threads: опубликованные посты"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
